<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>休息亭模型预览</title>
<style>
html,body{margin:0;overflow:hidden;font:14px system-ui;background:#a9bbc3;color:#24382a}
canvas{display:block}aside{position:fixed;top:24px;left:24px;padding:16px 20px;border-radius:16px;background:#fff9;backdrop-filter:blur(10px)}
h1{font-size:20px;margin:0 0 8px}p{margin:0 0 12px}button{border:1px solid #7d947b;background:#f8f9f3;padding:8px 12px;margin-right:6px;border-radius:8px;cursor:pointer}
</style>
<aside><h1>山路休息亭</h1><p>模型预览 · 在岛上的位置待标注确认</p><button id="day">白天</button><button id="night">夜晚</button><button id="winter">冬雪</button></aside>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { createRestPavilion } from '/src/rest-pavilion.js';
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.3;document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0xa9bdc8);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);
camera.position.set(7,17.5,8);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,13.7,0);controls.enableDamping=true;
const fill=new THREE.HemisphereLight(0xd8eafb,0x747a4c,2);scene.add(fill);
const sunlight=new THREE.DirectionalLight(0xffead1,3);sunlight.position.set(-7,25,7);sunlight.castShadow=true;
sunlight.shadow.mapSize.set(1024,1024);Object.assign(sunlight.shadow.camera,{left:-7,right:7,top:7,bottom:-7,near:.1,far:50});scene.add(sunlight);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(25,25),new THREE.MeshStandardMaterial({color:0x7b8861,roughness:1}));
ground.rotation.x=-Math.PI/2;ground.position.y=12;ground.receiveShadow=true;scene.add(ground);
const pavilion=createRestPavilion(scene,{heightAt:()=>12,position:{x:0,z:0},floorSize:2.3,approach:{x:0,y:12.038,z:2.1}});
let environment={daylight:1,season:'summer',snow:0},last=performance.now(),time=0;
document.getElementById('day').onclick=()=>{environment={daylight:1,season:'summer',snow:0};scene.background.setHex(0xa9bdc8);fill.intensity=2;sunlight.intensity=3;ground.material.color.setHex(0x7b8861);};
document.getElementById('night').onclick=()=>{environment={daylight:0,season:'summer',snow:0};scene.background.setHex(0x15263d);fill.intensity=.7;sunlight.intensity=.25;ground.material.color.setHex(0x7b8861);};
document.getElementById('winter').onclick=()=>{environment={daylight:1,season:'winter',snow:1};scene.background.setHex(0xb6c9cf);fill.intensity=2;sunlight.intensity=2;ground.material.color.setHex(0xdce5e0);};
function animate(now){time+=Math.min((now-last)/1000,.1);last=now;pavilion.update(time,environment);controls.update();renderer.render(scene,camera);requestAnimationFrame(animate)}
requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
addEventListener('pagehide',()=>{pavilion.dispose();ground.geometry.dispose();ground.material.dispose();controls.dispose();renderer.dispose()},{once:true});
</script>
</html>
