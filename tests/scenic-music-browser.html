<!doctype html>
<html lang="zh">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>全部音频试听与场景音乐验证</title>
<style>
 body{max-width:1000px;margin:32px auto;padding:0 20px;background:#f5f7f6;color:#203833;font:16px/1.6 system-ui,sans-serif}
 h1{font-size:26px}h2{font-size:20px;margin-top:30px}p,small{color:#52665f}
 button{font:inherit;cursor:pointer;border:1px solid #bacdc5;border-radius:7px;background:white;padding:7px 12px}
 button:focus-visible{outline:3px solid #397965;outline-offset:2px}
 .audio-row{display:grid;grid-template-columns:minmax(140px,1fr) minmax(250px,2fr);align-items:center;gap:8px 20px;background:white;border:1px solid #dce5e1;border-radius:10px;margin:10px 0;padding:14px}
 .audio-row audio{width:100%}.audio-row small{grid-column:1/-1;overflow-wrap:anywhere}.audio-error{grid-column:1/-1;color:#a52626}
 .audio-error:empty{display:none}.scene-controls{display:flex;gap:8px;flex-wrap:wrap}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}
 details{border-top:1px solid #bacdc5;margin-top:36px;padding-top:16px}summary{cursor:pointer;font-weight:600}
 @media(max-width:600px){.audio-row{grid-template-columns:1fr}}
</style>
<body>
<h1>全部音频试听</h1>
<p id="audio-count">正在读取音频列表……</p>
<div id="auditions"></div>
<details>
 <summary>场景播放器验证</summary>
 <p>用于验证随景轮换、暂停恢复和曲尾切换。独立试听时会自动暂停场景播放器。</p>
 <div class="scene-controls"><button id="start">开启播放</button><button id="day">晴日</button><button id="night">月夜</button><button id="quiet">雨雾</button><button id="sunset">日落</button><button id="mute">暂停</button><button id="resume">恢复</button><button id="tail">快进至尾声</button></div>
 <pre id="result">待开启</pre><div id="media"></div>
</details>
<script type="module" src="./scenic-music-browser.js"></script>
</body>
</html>
