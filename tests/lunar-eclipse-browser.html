<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>海岛月食 · 渲染验证</title>
<style>body{margin:0;background:#07111b;color:#f0f3dd;font:13px system-ui}canvas{display:block}aside{position:fixed;left:16px;bottom:16px;right:16px;padding:14px;background:#10251fe8;border:1px solid #ffffff30;border-radius:14px}h1{margin:0 0 10px;font-size:16px}nav{display:flex;flex-wrap:wrap;gap:6px}button,select{padding:7px 10px;color:inherit;background:#45614c;border:1px solid #ffffff30;border-radius:6px;cursor:pointer}label{display:flex;align-items:center;gap:8px;margin-top:10px}input{flex:1}output{display:block;margin-top:9px}p{font-size:12px;opacity:.7;margin-bottom:0}</style></head>
<body><canvas id="sky"></canvas><aside><h1>海岛月食 · 渲染验证</h1><nav><button data-phase="0">明亮满月</button><button data-phase="0.25">亮黄偏食</button><button data-phase="0.36">近全食暗影</button><button data-phase="0.39">全遮挡亮环</button><button data-phase="0.42">红月缓现</button><button data-phase="0.5">明亮红月</button><button data-phase="0.75">复圆中</button><button data-phase="1">完全复圆</button><button id="play">播放完整过程</button></nav><label><input id="enabled" type="checkbox" checked>启用月食效果（关闭后检查恢复）</label><label><input id="detail" type="checkbox">放大月面细节（仅预览尺寸）</label><label>视野<select id="fov"><option value="54">标准 54°</option><option value="80">广角 80°</option><option value="122">超广角 122°</option></select></label><label>月食进度<input id="phase" type="range" min="0" max="1" step=".001" value=".25"></label><output id="state"></output><p>复用正式月面、地影、海水与照明。偏食保持明亮暖黄色月面，不加边缘光圈；完全遮挡后先亮起红色日冕，再渐变成明亮红月并只留下窄边光，天空保持暗红；关闭月食检查恢复。</p></aside><script type="module" src="./lunar-eclipse-browser.js"></script></body></html>
