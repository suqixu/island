<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>海岛日食 · 渲染验证</title>
<style>body{margin:0;background:#09111a;color:#f0f3dd;font:13px system-ui}canvas{display:block}aside{position:fixed;left:16px;bottom:16px;right:16px;padding:14px;background:#10251fda;border:1px solid #ffffff30;border-radius:14px}h1{margin:0 0 10px;font-size:16px}nav{display:flex;flex-wrap:wrap;gap:6px}button{padding:7px 10px;color:inherit;background:#45614c;border:1px solid #ffffff30;border-radius:6px;cursor:pointer}label{display:flex;align-items:center;gap:8px;margin-top:10px}input{flex:1}output{display:block;margin-top:9px}p{font-size:12px;opacity:.7;margin-bottom:0}</style></head>
<body><canvas id="sky"></canvas><aside><h1>海岛日食 · 渲染验证</h1><nav><button data-phase="0">初亏</button><button data-phase="0.25">偏食</button><button data-phase="0.5">全食</button><button data-phase="0.75">复圆中</button><button data-phase="1">完全复圆</button><button id="play">播放完整过程</button></nav><label>视野<select id="fov"><option value="54">标准 54°</option><option value="80">广角 80°</option><option value="122">超广角 122°</option></select></label><label>日食进度<input id="phase" type="range" min="0" max="1" step=".001" value=".5"></label><output id="state"></output><p>直接复用正式海岛的天空、海面、日食遮挡与光照模块；可固定阶段检查日冕及亮度恢复，切换广角检查圆盘是否变形。</p></aside><script type="module" src="./solar-eclipse-browser.js"></script></body></html>
