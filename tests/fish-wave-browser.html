<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>鱼群跃浪 · 渲染验收</title>
<style>body{margin:0;background:#9ccbd7;color:#fff;font:14px system-ui}canvas{display:block}aside{position:fixed;bottom:18px;left:18px;max-width:90vw;padding:12px 16px;background:#15374bdd;border-radius:12px}button,select{margin:3px;padding:7px;color:inherit;background:#ffffff18;border:1px solid #ffffff55;border-radius:6px;cursor:pointer}input{width:240px;vertical-align:middle}output{display:block;margin:8px 0}p{font-size:12px;margin:6px 0}</style></head>
<body><aside><div><button data-age="2">聚集</button><button data-age="11">爆发</button><button data-age="22">消退</button><button data-weather="sunny">夕阳晴海</button><button data-weather="typhoon">台风停用</button><button data-weather="blizzard">暴风雪停用</button></div><label>进度 <input id="age" type="range" min="0" max="25" step=".05" value="11"></label><label>画质 <select id="quality"><option value="high">精细</option><option value="medium">均衡</option><option value="low">流畅</option></select></label><button id="play">播放</button><button id="relocate">换片海域</button><output id="status"></output><p>正式鱼群、海水与海岛模块；拖动环绕。切换阶段重新播放完整调度，再定位到所选时刻。</p></aside><script type="module" src="./fish-wave-browser.js"></script></body></html>
