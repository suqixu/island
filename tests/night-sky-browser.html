<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>海岛夜空 · 渲染验证</title>
<style>
body{margin:0;background:#060f22;color:#dfe7ed;font:14px system-ui}canvas{display:block;width:100vw;height:100vh}aside{position:fixed;left:16px;bottom:16px;max-width:min(620px,calc(100vw - 64px));background:#0b182be6;padding:14px 16px;border:1px solid #476275;border-radius:12px}h1{font-size:17px;margin:0 0 8px}p{margin:9px 0 0;font-size:12px;color:#a7b7c8}nav{display:flex;flex-wrap:wrap;gap:6px}button,select{background:#193248;color:inherit;border:1px solid #4c6877;border-radius:6px;padding:7px;cursor:pointer}label{display:inline-flex;align-items:center;gap:5px;margin-top:9px}output{display:block;margin-top:8px;font-variant-numeric:tabular-nums}
</style></head><body><canvas id="sky"></canvas><aside><h1>海岛夜空 · 渲染验证</h1><nav><button data-preset="milky">夏夜银河</button><button data-preset="orion">冬夜猎户</button><button data-preset="moon">明月夜</button><button data-preset="day">白天</button><button data-preset="fog">浓雾</button><button data-event="meteor">定位流星雨</button><button data-event="comet">定位彗星</button></nav><label><input id="running" type="checkbox" checked>运行动画</label> <label><input id="guides" type="checkbox" checked>星座指引</label> <label>画质<select id="quality"><option value="high">精细</option><option value="medium">均衡</option><option value="low">流畅</option></select></label> <label>定位星座<select id="constellation"><option value="">选择十二星座</option></select></label> <label>彗星类型<select id="comet-variant"><option value="random">随机</option></select></label><output id="state"></output><p>使用正式夜空模块与真实 WebGL。拖动转向；定位流星雨会推进调度并暂停；定位彗星会居中显示并继续动画。选择星座会切换到适合观察的时刻并居中显示。</p></aside><script type="module" src="./night-sky-browser.js"></script></body></html>
